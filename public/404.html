<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MPLADS AI Integrity & Monitoring System</title>
    <script>
      // Clean fallback redirect for GitHub Pages SPA
      (function() {
        var path = window.location.pathname;
        var parts = path.split('/').filter(Boolean);
        // If hosted on https://<username>.github.io/<repo>/, redirect to /<repo>/
        if (window.location.hostname.endsWith('github.io') && parts.length > 0) {
          window.location.replace('/' + parts[0] + '/');
        } else {
          window.location.replace('./');
        }
      })();
    </script>
  </head>
  <body style="margin: 0; padding: 40px; font-family: system-ui, -apple-system, sans-serif; background-color: #F8F9F7; text-align: center; color: #1B3022;">

      <div style="font-size: 32px; margin-bottom: 16px;">🏛️</div>
      <h2 style="color: #395C40; margin: 0 0 8px;">MPLADS AI Vigilance Portal</h2>
      <p style="color: #6B7E6F; font-size: 14px; margin-bottom: 24px;">Redirecting to the portal homepage...</p>

        Click here to continue →
      </a>
    </div>
